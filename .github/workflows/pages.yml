name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage static night
        run: |
          mkdir -p _site/js _site/vendor _site/assets
          cp index.html _site/
          cp *.css _site/
          cp -R js/. _site/js/
          [ -f .nojekyll ] && cp .nojekyll _site/
          [ -f LICENSE ] && cp LICENSE _site/
          [ -f ads.config.json ] && cp ads.config.json _site/
          [ -d vendor ] && cp -R vendor/. _site/vendor/
          [ -d assets ] && cp -R assets/. _site/assets/
          [ -f sponsor.html ] && cp sponsor.html _site/
          [ -f MARKETING.md ] && cp MARKETING.md _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
